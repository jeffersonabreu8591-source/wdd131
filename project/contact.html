<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Contact Fuxiquinha Style Guide.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Fuxiquinha Style Guide</title>

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>

    <div class="logo-container">
        <img src="images/logo.jpg" alt="Fuxiquinha Style Guide Logo">
        <h1>Fuxiquinha Style Guide</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="outfits.html">Outfits</a></li>
            <li><a href="tips.html">Fashion Tips</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<main>

    <h2>Contact Us</h2>

    <p id="welcome-message"></p>

    <form id="contact-form">

        <label for="fullname">
            Full Name
        </label>

        <input
            type="text"
            id="fullname"
            name="fullname"
            required>

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required>

        <label for="style">
            Favorite Style
        </label>

        <select
            id="style"
            name="style">

            <option value="Casual">
                Casual
            </option>

            <option value="Summer">
                Summer
            </option>

            <option value="Party">
                Party
            </option>

        </select>

        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            rows="5"
            required></textarea>

        <input
            type="submit"
            value="Send Message">

    </form>

</main>

<footer>

    <p>&copy; 2026 Fuxiquinha Style Guide</p>

    <a href="references.html">References</a>

</footer>

</body>
</html>
