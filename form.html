<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Jefferson Abreu">
    <meta name="description" content="Submit a product review by rating features, installation experience, and overall satisfaction using this responsive review form.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Product Review Form</title>

<link rel="stylesheet" href="styles/form.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<script src="scripts/form.js" defer></script>
```

</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

```
<form method="get" action="review.html">

    <div class="form-group">
        <label for="product">Product Name</label>

       <select id="product" name="product" required>
            <option value="" disabled selected>
                Select a Product ...
            </option>
        </select>
    </div>

   <fieldset class="rating">
    <legend>Overall Rating</legend>

    <label>
        ☆
        <input id="star1" type="radio" name="rating" value="1" required>
    </label>

    <label>
        ☆☆
        <input id="star2" type="radio" name="rating" value="2">
    </label>

    <label>
        ☆☆☆
        <input id="star3" type="radio" name="rating" value="3">
    </label>

    <label>
        ☆☆☆☆
        <input id="star4" type="radio" name="rating" value="4">
    </label>

    <label>
        ☆☆☆☆☆
        <input id="star5" type="radio" name="rating" value="5">
    </label>
</fieldset>

    <div class="form-group">
        <label for="installDate">
            Date of Installation *
        </label>

       <input type="date"
       id="installDate"
       name="installDate"
       required>
    </div>

    <fieldset>
        <p>
    Which features did you find useful in the product?
    <br>
    <em>(Check all that apply)</em>
</p>
        <input type="checkbox"
       id="durability"
       name="features"
       value="Durability">

<label for="durability">
    Durability
</label>

        <label>
            <input
                type="checkbox"
                id="ease"
                name="features"
                value="Ease of Use">
            Ease of Use
        </label>

        <label>
            <input
                type="checkbox"
                id="performance"
                name="features"
                value="Performance">
            Performance
        </label>

        <label>
            <input
                type="checkbox"
                id="design"
                name="features"
                value="Design">
            Design
        </label>
    </fieldset>

    <div class="form-group">
        <label for="review">
            Written Review (Optional)
        </label>

        <textarea
            id="review"
            name="review"
            rows="6">
        </textarea>
    </div>

    <div class="form-group">
        <label for="userName">
            User Name (Optional)
        </label>

        <input
            type="text"
            id="userName"
            name="userName">
    </div>

    <div class="form-group">
        <input
            type="submit"
            value="Submit Review">
    </div>

</form>
```

</main>

<footer>
    <p>
        © <span id="currentyear"></span> Jefferson Abreu | Brazil
    </p>

    <p id="lastModified"></p>
</footer>

</body>
</html>
